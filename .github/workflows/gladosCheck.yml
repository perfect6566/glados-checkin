name: GLaDOS 每日自动签到

# 每天北京时间 09:30 跑一次 (UTC 01:30),避开整点高峰
# UTC = 北京时间 - 8小时,所以 01:30 UTC = 09:30 北京时间
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch: # 允许在 Actions 页面手动点 Run workflow 测试

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 运行签到
        env:
          GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
          GLADOS_DOMAINS: glados.network
          GLADOS_EXCHANGE_PLAN: none
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          MAIL_SMTP: smtp.qq.com
          MAIL_PORT: 465
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: python checkin.py
